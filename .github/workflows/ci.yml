name: SoftFocus CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend CI gate + pipeline check
        run: |
          cd backend
          alias_softfocus/bin/ci-gate
          alias-softfocus run pipeline-check

  frontend:
    uses: ./.github/workflows/frontend.yml
    needs: backend
