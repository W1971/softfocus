name: SoftFocus CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend CI gate + pipeline check
        run: |
          ./scripts/alias/sfctl ci-gate
          ./scripts/alias/sfctl pipeline-check

  frontend:
    needs: backend
    uses: ./.github/workflows/frontend.yml
