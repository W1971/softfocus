name: SoftFocus CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend CI gates (FAIL-FAST)
        run: |
          ./scripts/alias/sfctl stage-1
          ./scripts/alias/sfctl stage-2
          ./scripts/alias/sfctl stage-3

      - name: Backend bundle check
        run: |
          ./scripts/alias/sfctl bundle

  frontend:
    needs: backend
    uses: ./.github/workflows/frontend.yml
