name: SoftFocus CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Phase D — backend verification only
        run: |
          echo "Phase D: governance frozen"
          echo "No stage gates executed"

      - name: Verify bundle reproducibility
        run: |
          ./scripts/alias/sfctl bundle

  frontend:
    needs: backend
    uses: ./.github/workflows/frontend.yml
